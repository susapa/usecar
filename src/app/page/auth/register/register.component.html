<div class="min-h-screen flex items-center justify-center bg-gray-50 p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
    <div class="h-4 w-full rounded-t-2xl bg-gradient-to-r from-emerald-400 to-green-500 opacity-75"></div>

    <div class="p-8 md:p-10">
      <div class="text-center mb-8">
        <div class="mx-auto h-16 w-16 mb-4">
          <img src="logo.png" alt="UseCar Logo" class="w-full h-full object-contain">
        </div>
        <h1 class="text-2xl font-semibold text-gray-800">Create Your UseCar Account</h1>
        <p class="text-gray-500 text-sm mt-1">Join us to start managing your cars!</p>
      </div>

      <form  #f="ngForm" (ngSubmit)="handleRegistration(f.value)" class="space-y-6">

        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
          <div class="mt-1">
            <input [(ngModel)]="email" id="email" name="email" type="email" required placeholder="Enter your email"
              class="appearance-none block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm" />
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
          <div class="mt-1 relative">
            <input [(ngModel)]="password" id="password" name="password" type="password" required
              placeholder="Create a password"
              class="appearance-none block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm pr-10" />
            <button type="button"
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-sm leading-5 text-gray-500">
              <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>

        <div>
          <label for="confirm-password" class="block text-sm font-medium text-gray-700">Confirm Password</label>
          <div class="mt-1 relative">
            <input [(ngModel)]="confirmPassword" id="confirm-password" name="confirm-password" type="password" required
              placeholder="Repeat your password"
              class="appearance-none block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm pr-10" />
          </div>
        </div>

        <div class="flex items-center">
          <input [(ngModel)]="isTermsAccepted" id="terms" name="terms" type="checkbox" required
            class="h-4 w-4 text-green-600 focus:ring-green-500 border-gray-300 rounded" />
          <label for="terms" class="ml-2 block text-sm text-gray-900">
            I agree to the
            <a href="#" class="font-medium text-green-600 hover:text-green-500">Terms</a>
            and
            <a href="#" class="font-medium text-green-600 hover:text-green-500">Privacy Policy</a>
          </label>
        </div>


        <div>
          <button [disabled]="isRegisterButtonDisabled()" type="submit"
            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-500 hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition duration-150 ease-in-out">
            Register Account
          </button>
        </div>
      
      </form>

      <p class="mt-6 text-center text-sm text-gray-600">
        Already have an account?
        <a href="/auth/login" class="font-semibold text-green-600 hover:text-green-500 underline">
          Sign In
        </a>
      </p>

    </div>
  </div>
</div>
